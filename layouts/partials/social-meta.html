{{ $title := cond .IsHome "Hexzzle - Free Color Hive Puzzle Online" (or .Params.meta_title (printf "%s | %s" .Title .Site.Title)) }}
{{ $description := or .Params.description .Site.Params.description }}
{{ $image := absURL (or .Params.og_image .Site.Params.ogImage "/images/hexzzle-og.svg") }}
<meta property="og:type" content="{{ if .Params.game_shell }}website{{ else }}website{{ end }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ $image }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ $title }}">
<meta name="twitter:description" content="{{ $description }}">
<meta name="twitter:image" content="{{ $image }}">
